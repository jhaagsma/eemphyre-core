# Sample Apache 2.4 vhost for an EmPHyre app. A starting point to copy: change the names and paths.
#
# Server-wide settings this file cannot make (they are not allowed in a <VirtualHost>); on
# Debian/Ubuntu they live in /etc/apache2/conf-available/security.conf:
#     ServerTokens Prod
#     ServerSignature Off
#
# HTTP only: put TLS in front (a proxy such as nginx) or add a matching *:443 vhost.

<VirtualHost *:80>
    ServerAdmin webmaster@example.dev
    ServerName eemphyre.example.dev

    # Every URL goes to the router (index.php), existing files included, except certificate
    # renewal challenges (ACME http-01), which must be served as files.
    RewriteEngine on
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule /* /index.php

    # The web root is the app's public directory, not the repository root, so .git, config
    # files and the rest of the code are never served.
    DocumentRoot /var/www/eemphyre/www/
    <Directory /var/www/eemphyre/www/>
        # No directory listings, no content negotiation (MultiViews can serve foo.php.bak for /foo)
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        <IfModule mod_xsendfile.c>
            XSendFile On
            #Add additional XSendFilePaths here
            #XSendFilePath /tmp
        </IfModule>
    </Directory>

    # Dotfiles (.git, .env, .htpasswd) are never served, even if they end up in the web root;
    # /.well-known/ is the exception (see the rewrite above).
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    ErrorDocument 404 /404.php

    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/eemphyre-error.log
    CustomLog ${APACHE_LOG_DIR}/eemphyre-access.log combined

    ServerSignature Off
    TraceEnable Off
</VirtualHost>
